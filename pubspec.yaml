name: taller_flutter
description: Aplicación web de catálogo y reproducción de películas.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  firebase_database: ^11.3.0
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.6.12

  google_sign_in: ^6.3.0

  youtube_player_flutter: ^10.0.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  cached_network_image: ^3.3.1

  video_player: ^2.13.0
  file_picker: ^9.2.0
  provider: ^6.1.4
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/peliculas.json